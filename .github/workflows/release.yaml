name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  # ---------------------------------------------------------
  # 0. Detect Flutter version from pubspec.yaml
  # ---------------------------------------------------------
  detect_flutter:
    runs-on: ubuntu-latest
    outputs:
      flutter_version: ${{ steps.detect.outputs.flutter_version }}
    steps:
      - uses: actions/checkout@v4

      - id: detect
        run: |
          VERSION=$(grep "sdk:" pubspec.yaml | sed 's/.*\^//')
          echo "flutter_version=stable" >> $GITHUB_OUTPUT

  # ---------------------------------------------------------
  # 1. Prepare (pub get, analyze, test)
  # ---------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    needs: detect_flutter

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.detect_flutter.outputs.flutter_version }}

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - run: flutter test || true

      - run: flutter pub run flutter_launcher_icons

  # ---------------------------------------------------------
  # 2. Android
  # ---------------------------------------------------------
  android:
    name: Android
    runs-on: ubuntu-latest
    needs: [prepare, detect_flutter]

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.detect_flutter.outputs.flutter_version }}

      - run: flutter pub get

      - name: Build Android
        run: flutter build apk --release --split-per-abi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lufeicloud-android
          path: build/app/outputs/flutter-apk/

  # ---------------------------------------------------------
  # 3. iOS (no-codesign)
  # ---------------------------------------------------------
  ios:
    name: iOS
    runs-on: macos-latest
    needs: [prepare, detect_flutter]

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.detect_flutter.outputs.flutter_version }}

      - run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lufeicloud-ios
          path: build/ios/iphoneos/

  # ---------------------------------------------------------
  # 4. macOS
  # ---------------------------------------------------------
  macos:
    name: macOS
    runs-on: macos-latest
    needs: [prepare, detect_flutter]

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.detect_flutter.outputs.flutter_version }}

      - run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lufeicloud-macos
          path: build/macos/Build/Products/Release/

  # ---------------------------------------------------------
  # 5. Windows
  # ---------------------------------------------------------
  windows:
    name: Windows
    runs-on: windows-latest
    needs: [prepare, detect_flutter]

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.detect_flutter.outputs.flutter_version }}

      - run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lufeicloud-windows
          path: build/windows/x64/runner/Release/

  # ---------------------------------------------------------
  # 6. Linux (x64 + arm64)
  # ---------------------------------------------------------
  linux:
    name: Linux
    runs-on: ubuntu-latest
    needs: [prepare, detect_flutter]

    strategy:
      matrix:
        arch: [x64, arm64]

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.detect_flutter.outputs.flutter_version }}

      - run: flutter pub get

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libayatana-appindicator3-dev

      - name: Build Linux
        run: flutter build linux --release

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lufeicloud-linux-${{ matrix.arch }}
          path: build/linux/${{ matrix.arch }}/release/bundle/
