name: Flux Multi-Platform Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# ---------------------------------------------------------
# 1. 自动解析 pubspec.yaml → 自动匹配 Flutter 版本
# ---------------------------------------------------------
jobs:
  detect_flutter:
    name: Detect Flutter Version
    runs-on: ubuntu-latest
    outputs:
      flutter_version: ${{ steps.resolve.outputs.flutter_version }}

    steps:
      - uses: actions/checkout@v4

      - name: Read Dart SDK version from pubspec.yaml
        id: dart
        run: |
          LINE=$(grep -E 'sdk:' pubspec.yaml | head -n 1)
          VERSION=$(echo "$LINE" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "dart_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Resolve Flutter version for Dart SDK
        id: resolve
        run: |
          DART_VERSION="${{ steps.dart.outputs.dart_version }}"
          echo "Detected Dart version: $DART_VERSION"

          if [[ "$DART_VERSION" == 3.9.* ]]; then
            FLUTTER_VERSION="3.38.7"
          elif [[ "$DART_VERSION" == 3.8.* ]]; then
            FLUTTER_VERSION="3.27.0"
          elif [[ "$DART_VERSION" == 3.7.* ]]; then
            FLUTTER_VERSION="3.22.0"
          else
            echo "Unsupported Dart version: $DART_VERSION"
            exit 1
          fi

          echo "flutter_version=$FLUTTER_VERSION" >> $GITHUB_OUTPUT

# ---------------------------------------------------------
# 2. Prepare：分析 + 测试 + 自动生成图标
# ---------------------------------------------------------
  prepare:
    name: Prepare & Analyze
    needs: detect_flutter
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.detect_flutter.outputs.flutter_version }}

      - run: flutter pub get || true
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test || true

      - name: Generate App Icons
        run: flutter pub run flutter_launcher_icons

# ---------------------------------------------------------
# 3. Android（split-per-abi）
# ---------------------------------------------------------
  android:
    name: Android
    needs: [prepare, detect_flutter]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.detect_flutter.outputs.flutter_version }}

      - run: flutter pub get

      - name: Build Android split-per-abi
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: flux-android
          path: build/app/outputs/flutter-apk/*.apk

# ---------------------------------------------------------
# 4. macOS（只上传 .app，避免 1.4GB）
# ---------------------------------------------------------
  macos:
    name: macOS Universal
    needs: [prepare, detect_flutter]
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.detect_flutter.outputs.flutter_version }}

      - run: flutter pub get
      - run: flutter build macos --release

      - uses: actions/upload-artifact@v4
        with:
          name: flux-macos
          path: build/macos/Build/Products/Release/Flux.app

# ---------------------------------------------------------
# 5. Windows（仅 x64）
# ---------------------------------------------------------
  windows:
    name: Windows
    needs: [prepare, detect_flutter]
    runs-on: windows-latest

    strategy:
      matrix:
        arch: [x64]

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.detect_flutter.outputs.flutter_version }}

      - run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: flux-windows-${{ matrix.arch }}
          path: build/windows/x64/runner/Release/

# ---------------------------------------------------------
# 6. Linux（仅 x64）
# ---------------------------------------------------------
  linux:
    name: Linux
    needs: [prepare, detect_flutter]
    runs-on: ubuntu-latest

    strategy:
      matrix:
        arch: [x64]

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.detect_flutter.outputs.flutter_version }}

      - run: flutter pub get

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libayatana-appindicator3-dev

      - name: Build Linux
        run: flutter build linux --release

      - uses: actions/upload-artifact@v4
        with:
          name: flux-linux-${{ matrix.arch }}
          path: build/linux/x64/release/bundle/

# ---------------------------------------------------------
# 7. 自动创建 GitHub Release
# ---------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [android, macos, windows, linux]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
