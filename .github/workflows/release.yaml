name: Flux Multi-Platform Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# ---------------------------------------------------------
# 1. 自动解析 pubspec.yaml → 自动匹配 Flutter 版本
# ---------------------------------------------------------
jobs:
  detect_flutter:
    name: Detect Flutter Version
    runs-on: ubuntu-latest
    outputs:
      flutter_version: ${{ steps.resolve.outputs.flutter_version }}

    steps:
      - uses: actions/checkout@v4

      - name: Read Dart SDK version from pubspec.yaml
        id: dart
        run: |
          LINE=$(grep -E 'sdk:' pubspec.yaml | head -n 1)
          VERSION=$(echo "$LINE" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "dart_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Resolve Flutter version for Dart SDK
        id: resolve
        run: |
          DART_VERSION="${{ steps.dart.outputs.dart_version }}"
          echo "Detected Dart version: $DART_VERSION"

          if [[ "$DART_VERSION" == 3.9.* ]]; then
            FLUTTER_VERSION="3.38.7"
          elif [[ "$DART_VERSION" == 3.8.* ]]; then
            FLUTTER_VERSION="3.27.0"
          elif [[ "$DART_VERSION" == 3.7.* ]]; then
            FLUTTER_VERSION="3.22.0"
          else
            echo "Unsupported Dart version: $DART_VERSION"
            exit 1
          fi

          echo "flutter_version=$FLUTTER_VERSION" >> $GITHUB_OUTPUT

# ---------------------------------------------------------
# 2. Prepare：分析 + 测试 + 自动生成图标
# ---------------------------------------------------------
  prepare:
    name: Prepare & Analyze
    needs: detect_flutter
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.detect_flutter.outputs.flutter_version }}

      - run: flutter pub get || true
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test || true

      - name: Generate App Icons
        run: flutter pub run flutter_launcher_icons

# ---------------------------------------------------------
# 3. Android（split-per-abi）
# ---------------------------------------------------------
  android:
    name: Android
    needs: [prepare, detect_flutter]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.detect_flutter.outputs.flutter_version }}

      - run: flutter pub get

      - name: Build Android split-per-abi
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: flux-android
          path: build/app/outputs/flutter-apk/*.apk

# ---------------------------------------------------------
# 4. macOS（DMG + strip）
# ---------------------------------------------------------
  macos:
    name: macOS DMG
    needs: [prepare, detect_flutter]
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.detect_flutter.outputs.flutter_version }}

      - run: flutter pub get
      - run: flutter build macos --release

      - name: Remove dSYM
        run: rm -rf build/macos/Build/Products/Release/*.dSYM

      - name: Strip macOS binaries
        run: |
          find build/macos/Build/Products/Release/*.app -type f -perm +111 -exec strip {} \; || true

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          APP=$(ls build/macos/Build/Products/Release/*.app | xargs -n 1 basename)
          create-dmg \
            --volname "LufeiCloud" \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 400 200 \
            "LufeiCloud.dmg" \
            "build/macos/Build/Products/Release/$APP"

      - uses: actions/upload-artifact@v4
        with:
          name: flux-macos-dmg
          path: LufeiCloud.dmg

# ---------------------------------------------------------
# 5. Windows（ZIP + MSIX + strip + UPX）
# ---------------------------------------------------------
  windows:
    name: Windows ZIP + MSIX
    needs: [prepare, detect_flutter]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.detect_flutter.outputs.flutter_version }}

      - run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Install UPX
        run: choco install upx -y

      - name: Strip Windows binaries
        run: |
          cd build/windows/x64/runner/Release
          strip *.exe || true
          strip *.dll || true

      - name: UPX compress Windows binaries
        run: |
          cd build/windows/x64/runner/Release
          upx --best --lzma *.exe || true
          upx --best --lzma *.dll || true

      - name: Create Windows ZIP
        run: |
          cd build/windows/x64/runner/Release
          powershell Compress-Archive -Path * -DestinationPath ../../../../LufeiCloud-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: flux-windows-zip
          path: LufeiCloud-Windows.zip

      - name: Build MSIX
        run: flutter pub run msix:create

      - uses: actions/upload-artifact@v4
        with:
          name: flux-windows-msix
          path: build/windows/runner/Release/*.msix

# ---------------------------------------------------------
# 6. Linux（DEB + RPM + strip + UPX）
# ---------------------------------------------------------
  linux:
    name: Linux DEB + RPM
    needs: [prepare, detect_flutter]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.detect_flutter.outputs.flutter_version }}

      - run: flutter pub get

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libayatana-appindicator3-dev \
            ruby ruby-dev rubygems build-essential \
            upx
          sudo gem install --no-document fpm

      - name: Build Linux
        run: flutter build linux --release

      - name: Strip Linux binaries
        run: |
          cd build/linux/x64/release/bundle
          strip lib/*.so || true
          strip *.so || true

      - name: UPX compress Linux binaries
        run: |
          cd build/linux/x64/release/bundle
          upx --best --lzma lib/*.so || true
          upx --best --lzma *.so || true

      - name: Create DEB package
        run: |
          fpm -s dir -t deb \
            -n lufeicloud \
            -v 1.0.0 \
            --prefix /opt/lufeicloud \
            build/linux/x64/release/bundle/

      - name: Create RPM package
        run: |
          fpm -s dir -t rpm \
            -n lufeicloud \
            -v 1.0.0 \
            --prefix /opt/lufeicloud \
            build/linux/x64/release/bundle/

      - uses: actions/upload-artifact@v4
        with:
          name: flux-linux-deb
          path: *.deb

      - uses: actions/upload-artifact@v4
        with:
          name: flux-linux-rpm
          path: *.rpm
